# OKÜ Dijital Yerleşke — statik yayın yapılandırması
#
# Bu dosya personal-web container'ına /etc/nginx/conf.d/default.conf olarak
# TEK DOSYA bağlanır; site kökü doğrudan /opt/vr'dir. Dosyayı YERİNDE
# güncelleyin (cat > ...): silip yeniden oluşturmak yeni bir inode üretir ve
# container eskisini görmeye devam eder. Sonra: make reload
#
# Önbellek: /assets altındaki css/js/woff2/wasm adresleri build sırasında
# içerik hash'iyle damgalanır (?v=…), bu yüzden "immutable" güvenlidir.
# Görseller de damgalıdır ama yerinde güncellenebildikleri için 30 gün tutulur.
#
# no-transform: Cloudflare'in otomatik Web Analytics betiğini (beacon.min.js)
# HTML'e eklemesini engeller. Sitenin CSP'si üçüncü taraf betiğe izin vermez;
# eklenen betik her sayfada konsol hatası üretiyordu. Ölçüm zaten kendi
# çerezsiz /e ucuyla yapılıyor.
#
# Brotli: resmî nginx:alpine imajında ngx_brotli yoktur; yalnızca gzip açık.

# Kullanım ölçümü günlüğü — BİLİNÇLİ olarak yalnızca zaman damgası ve sorgu
# dizesi yazılır: IP, user-agent, referrer ve çerez kaydedilmez.
log_format oku_events '$time_iso8601 $args';

# İçerik türüne göre önbellek politikası (ilk eşleşen düzenli ifade kazanır).
map $uri $oku_cache_control {
  default                                              "no-cache, no-transform";
  /geometry-lod-sw.js                                  "no-cache";
  ~^/assets/.+\.(?:css|js|mjs|wasm|woff2)$             "public, max-age=31536000, immutable";
  ~^/assets/.+\.(?:avif|webp|png|jpe?g|svg|gif|ico)$   "public, max-age=2592000";
  ~\.(?:hdr|webm)$                                     "public, max-age=2592000";
  ~\.(?:glb|gltf|bin|ktx2)$                            "public, max-age=604800";
  ~\.(?:jpe?g|png|webp)$                               "public, max-age=604800";
  ~\.(?:json|webmanifest|xml)$                         "public, max-age=3600";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/css text/xml text/plain application/javascript application/json application/manifest+json image/svg+xml;

  etag on;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml text/javascript application/javascript application/json
    application/manifest+json application/xml application/wasm model/gltf+json image/svg+xml image/vnd.radiance;

  # Bütün yanıtlar (konum bloğunda add_header yoksa bunlar geçerlidir).
  add_header Cache-Control $oku_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # AR için kamera ve WebXR uzamsal izleme izni görüntüleyicide gerekir.
  add_header Permissions-Policy "camera=(self), xr-spatial-tracking=(self), fullscreen=(self), geolocation=(), microphone=(), payment=(), usb=()" always;

  # ---- Yayına ait olmayan dosyalar: kaynaklar, araçlar, notlar ----
  location ~ /\.                  { return 404; }
  location ^~ /src/               { return 404; }
  location ^~ /tools/             { return 404; }
  location ^~ /deploy/            { return 404; }
  location = /Makefile            { return 404; }
  location ~* \.(?:md|py|sh|mjs|lock)$ { return 404; }

  # ---- Ölçüm ucu: gövde yok, yalnızca 204 ve günlük satırı ----
  location = /e {
    access_log /dev/stdout oku_events;
    add_header Cache-Control "no-store" always;
    return 204;
  }

  # ---- nginx mime.types'ta olmayan türler ----
  # Boş `types {}` + default_type yalnızca bu uzantıları etkiler.
  location ~* \.webmanifest$ { types { } default_type application/manifest+json; try_files $uri =404; }
  location ~* \.gltf$        { types { } default_type model/gltf+json; try_files $uri =404; }
  location ~* \.glb$         { types { } default_type model/gltf-binary; try_files $uri =404; }
  location ~* \.bin$         { types { } default_type application/gltf-buffer; try_files $uri =404; }
  location ~* \.ktx2$        { types { } default_type image/ktx2; try_files $uri =404; }
  location ~* \.hdr$         { types { } default_type image/vnd.radiance; try_files $uri =404; }

  # Markalı, iki dilli 404 (build_site.py üretir; varlıklar kökten mutlak).
  error_page 404 /404.html;
  location = /404.html { internal; }

  location / {
    try_files $uri $uri/ =404;
  }
}
