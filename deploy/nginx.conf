# OKÜ Dijital Yerleşke — statik yayın yapılandırması
#
# Bu dosya personal-web container'ına /etc/nginx/conf.d/default.conf olarak
# bağlanır; site kökü doğrudan /opt/vr'dir.
#
# NOT (Brotli): resmî nginx:alpine imajında ngx_brotli modülü YOKTUR
# (`nginx -V` çıktısında brotli görünmez), bu yüzden yalnızca gzip
# etkinleştirilmiştir. Brotli istenirse brotli ile derlenmiş bir imaja
# geçilmeli ve buraya `brotli on; brotli_types ...;` eklenmelidir.
#
# NOT (önbellek): /assets altındaki css/js/woff2/wasm dosyalarının adresleri
# tools/build_site.py tarafından içerik hash'i ile damgalanır (`?v=<sha256>`),
# bu yüzden "immutable" güvenlidir. Posterler ve model dosyaları damgalanmadığı
# ve yerinde güncellendiği için kısa ömürlü tutulur.

# Kullanım ölçümü günlüğü — BİLİNÇLİ olarak yalnızca zaman damgası ve sorgu
# dizesi yazılır: IP, user-agent, referrer ve çerez kaydedilmez. Böylece
# kişisel veri işlenmeden temel kullanım metrikleri toplanabilir.
# (log_format http bağlamında olmalıdır; conf.d dosyaları http içine dahil edilir.)
log_format oku_events '$time_iso8601 $args';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        text/xml
        application/wasm
        model/gltf+json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    # ---- HTML: her zaman doğrulanır ----
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), xr-spatial-tracking=(self), fullscreen=(self), geolocation=(), microphone=(), payment=()" always;
        try_files $uri =404;
    }

    location = /viewer.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # AR için kamera ve WebXR uzamsal izleme izni AÇIK olmalıdır.
        add_header Permissions-Policy "camera=(self), xr-spatial-tracking=(self), fullscreen=(self), geolocation=(), microphone=(), payment=()" always;
        try_files $uri =404;
    }

    # ---- Ölçüm ucu: gövde yok, yalnızca 204 ve günlük satırı ----
    location = /e {
        access_log /dev/stdout oku_events;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # ---- PWA manifesti: nginx mime.types'ta webmanifest yok ----
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /map.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), xr-spatial-tracking=(self), fullscreen=(self), geolocation=(), microphone=(), payment=()" always;
        try_files $uri =404;
    }

    # ---- Service worker: asla uzun süre önbelleklenmez ----
    location = /geometry-lod-sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Damgalı varlıklar (?v=<içerik hash'i>) → bir yıl, immutable ----
    location ~* ^/assets/.*\.(?:css|js|mjs|wasm|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- HDR ortam haritası: nadiren değişir, fetch ile yüklenir → 30 gün ----
    location ~* \.hdr$ {
        default_type image/vnd.radiance;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Turntable döngüleri (alfa kanallı VP9/WebM) → 30 gün ----
    location ~* \.webm$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Posterler / görseller: damgasız, yerinde güncellenebilir → 30 gün ----
    location ~* ^/assets/.*\.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Model manifestleri ve kalan css/js/json ----
    location ~* \.(?:css|js|json)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- 3B model dosyaları ----
    # Kademe dosyaları (low/medium/high.glb) yeniden üretildiğinde aynı adla
    # üzerine yazılır; bu nedenle "immutable" DEĞİL, 7 gün kullanılır.
    location ~* \.gltf$ {
        default_type model/gltf+json;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.bin$ {
        types {
            application/gltf-buffer bin;
        }
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(?:jpe?g|ktx2|png|webp)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
