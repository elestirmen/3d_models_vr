  <body>
    <header class="map-header">
      <a class="map-back" href="./">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Galeri
      </a>
      <div class="map-title">
        <h1>Kampüs Haritası</h1>
        <p id="mapSubtitle">Yerleşke planı üzerinde bir yapı seçin.</p>
      </div>
    </header>

    <main class="map-stage" id="mapStage">
      <div class="map-viewport" id="mapViewport">
        <div class="map-canvas" id="mapCanvas">
          <picture>
            <source type="image/avif" srcset="assets/map/campus-plan.avif?v=8eac8fb9a7">
            <img id="mapImage" class="map-image" src="assets/map/campus-plan.webp?v=2b4e47912e"

                 width="1332" height="1395" decoding="async">
          </picture>
          <div class="map-markers" id="mapMarkers"></div>
        </div>
      </div>

      <div class="map-zoom" role="group" aria-label="Harita yakınlaştırma">
        <button id="zoomIn" type="button" aria-label="Yakınlaştır">+</button>
        <button id="zoomOut" type="button" aria-label="Uzaklaştır">−</button>
        <button id="zoomFit" type="button">Sığdır</button>
      </div>

      <p id="mapNotice" class="map-notice is-hidden"></p>
    </main>

    <aside id="mapPanel" class="map-panel is-hidden" role="region" aria-label="Seçilen yapı">
      <button id="mapPanelClose" class="map-panel-close" type="button" aria-label="Paneli kapat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>

      <div id="mapPanelBody"></div>

    <script src="assets/models.generated.js?v=bdd96bce78"></script>
