name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Model dosyaları Git LFS'te ve onlarca MB; CI arayüz regresyonlarını
          # kontrol ediyor, 3B yükleme adımı LFS işaretçisi görünce otomatik
          # atlanıyor (tools/smoke.mjs).
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python bağımlılıkları
        run: pip install --quiet jsonschema

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Araç bağımlılıkları
        working-directory: tools
        run: npm ci

      - name: Tarayıcı
        working-directory: tools
        run: npx playwright install --with-deps chromium

      - name: Manifest ve varlık doğrulaması
        run: python3 tools/doctor.py

      - name: Sözdizimi
        run: make lint

      - name: Varlık damgası tazeliği
        # Bayat damga (çıkış 3): build_site.py çalıştırılmadan commit edilmiş.
        run: python3 tools/build_site.py --check

      - name: Duman testi
        run: node tools/smoke.mjs --skip-model

      - name: Başarısızlıkta ekran görüntüleri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            *.png
          if-no-files-found: ignore
