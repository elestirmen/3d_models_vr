<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <title>Marka görseli</title>
    <base href="/">
    <!--
      tools/build_brand.mjs tarafından kullanılan render koşumu: paylaşım
      kartları (1200×630) ve uygulama ikonları sitenin kendi yazı tipi ve
      renkleriyle üretilir. Parametreler sorgu dizesinden okunur.
    -->
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <style>
      html, body { margin: 0; background: transparent; }
      body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(70% 90% at 78% 58%, #fbfaf6 0%, #efebe2 52%, #e2ddd1 100%);
        color: #1c1a17;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(28, 26, 23, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(28, 26, 23, 0.05) 1px, transparent 1px);
        background-size: 48px 48px;
        -webkit-mask-image: radial-gradient(ellipse at 74% 56%, #000 15%, transparent 68%);
        mask-image: radial-gradient(ellipse at 74% 56%, #000 15%, transparent 68%);
      }
      .ring { position: absolute; left: 590px; top: 170px; width: 560px; height: 330px; border: 2px solid rgba(179, 68, 31, 0.22); border-radius: 50%; transform: rotate(-12deg); }
      .poster { position: absolute; right: 18px; top: 92px; width: 700px; height: auto; filter: drop-shadow(0 34px 26px rgba(30, 24, 16, 0.26)); }
      .copy { position: absolute; left: 72px; top: 76px; bottom: 70px; width: 470px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 16px; }
      .mark { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(145deg, #c4532c, #93351a); box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 10px 20px -8px #93351a; }
      .mark svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .brand b { display: block; font-size: 24px; font-weight: 750; letter-spacing: -0.02em; }
      .brand b span { font-weight: 500; }
      .brand small { display: block; margin-top: 3px; color: #66615a; font-size: 15px; font-weight: 600; }
      .eyebrow { margin-top: auto; color: #8c3317; font-size: 18px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
      h1 { margin: 12px 0 0; font-size: 68px; line-height: 1.02; font-weight: 750; letter-spacing: -0.035em; text-wrap: balance; }
      h1.long { font-size: 56px; }
      .type { margin-top: 16px; color: #545049; font-size: 24px; font-weight: 550; }
      .chips { display: flex; gap: 10px; margin-top: 28px; }
      .chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: #fff; color: #1c1a17; font-size: 18px; font-weight: 700; box-shadow: 0 2px 6px rgba(30,24,16,.08); }
      .chip--accent { background: #b3441f; color: #fff; }
      .url { position: absolute; right: 40px; bottom: 30px; color: #66615a; font-size: 17px; font-weight: 650; letter-spacing: 0.02em; }

      /* Uygulama ikonu */
      .icon { position: relative; display: grid; place-items: center; background: linear-gradient(145deg, #c4532c, #93351a); }
      .icon svg { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const params = new URLSearchParams(location.search);
      // Büyük harf dönüşümü dile göre yapılır (Türkçe kurallar i → İ yapar).
      document.documentElement.lang = params.get('lang') || 'tr';
      const root = document.getElementById('root');
      const cube = '<svg viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>';
      const text = (value) => String(value || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      if (params.get('kind') === 'icon') {
        const size = Number(params.get('size')) || 512;
        const maskable = params.get('maskable') === '1';
        // Maskelenebilir ikonda içerik güvenli bölgeye (%60) sığar; köşe yuvarlatma yok.
        const glyph = Math.round(size * (maskable ? 0.42 : 0.6));
        const radius = maskable ? 0 : Math.round(size * 0.22);
        root.innerHTML = `<div class="icon" style="width:${size}px;height:${size}px;border-radius:${radius}px">`
          + cube.replace('<svg ', `<svg style="width:${glyph}px;height:${glyph}px;stroke-width:${maskable ? 1.5 : 1.45}" `) + '</div>';
      } else {
        const title = params.get('title') || '';
        root.innerHTML = `<div class="card">
          <span class="ring"></span>
          ${params.get('poster') ? `<img class="poster" src="${text(params.get('poster'))}" alt="">` : ''}
          <div class="copy">
            <div class="brand"><span class="mark">${cube}</span><span><b>OKÜ <span>${text(params.get('brand'))}</span></b><small>${text(params.get('org'))}</small></span></div>
            <p class="eyebrow">${text(params.get('eyebrow'))}</p>
            <h1 class="${title.length > 22 ? 'long' : ''}">${text(title)}</h1>
            ${params.get('type') ? `<p class="type">${text(params.get('type'))}</p>` : ''}
            <p class="chips"><span class="chip chip--accent">${text(params.get('cta'))}</span><span class="chip">AR</span></p>
          </div>
          <span class="url">${text(params.get('url'))}</span>
        </div>`;
      }
      const images = [...document.images];
      Promise.all([document.fonts.ready, ...images.map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; }))])
        .then(() => { window.__ready = true; });
    </script>
  </body>
</html>
